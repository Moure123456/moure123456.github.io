<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>لعبة صياد السمك المطور - Pi Fisherman</title>
    <!-- استدعاء مكتبة Pi SDK الرسمية -->
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background-color: #0c1b2a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #gameContainer {
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            border-radius: 12px;
            overflow: hidden;
            background: #87CEEB;
            width: 100%;
            max-width: 450px;
            height: 100vh;
            max-height: 800px;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }
        .ui-panel {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            background: rgba(0, 0, 0, 0.75);
            padding: 8px 12px;
            border-radius: 25px;
            color: #fff;
            font-weight: bold;
            font-size: 12px;
            border: 1px solid rgba(255,255,255,0.3);
            z-index: 10;
            white-space: nowrap;
        }
        .pi-badge { color: #f39c12; }
    </style>
</head>
<body>

    <div id="gameContainer">
        <div class="ui-panel">
            <div>اللاعب: <span id="usernameDisplay" class="pi-badge">زائر</span></div>
            <div>|</div>
            <div>النقاط: <span id="currentPi" class="pi-badge">0</span></div>
            <div>|</div>
            <div>المحفظة: <span id="walletPi" class="pi-badge">0</span></div>
            <div>|</div>
            <div><span id="statusText">نهار ☀️</span></div>
        </div>
        <canvas id="gameCanvas" width="400" height="700"></canvas>
    </div>

    <script>
        // تهيئة Pi SDK
        Pi.init({ version: "2.0", sandbox: true });

        const scopes = ['username', 'payments'];

        function onIncompletePaymentFound(payment) {
            console.log("وجد معاملة غير مكتملة:", payment);
        }

        // تسجيل الدخول التلقائي عند فتح اللعبة عبر Pi Browser
        Pi.authenticate(scopes, onIncompletePaymentFound).then(function(auth) {
            console.log("تم تسجيل الدخول بنجاح للمستخدم: " + auth.user.username);
            document.getElementById("usernameDisplay").innerText = auth.user.username;
        }).catch(function(error) {
            console.error("فشل تسجيل الدخول:", error);
            document.getElementById("usernameDisplay").innerText = "خطأ بالمحفظة";
        });

        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let currentPi = 0;
        let walletPi = 0;
        let isNight = false;

        // إعدادات الصياد والسنارة
        const fisher = { x: 90, y: 380 };
        const rodTip = { x: 120, y: 340 };
        let hook = { x: 120, y: 340, targetX: 120, targetY: 340, state: 'idle', caughtFish: null };

        // المراكب
        const boats = [
            { x: 250, y: 320, speed: 0.4, size: 50 },
            { x: 80, y: 290, speed: -0.3, size: 40 }
        ];

        // النجوم
        const stars = [];
        for(let i=0; i<40; i++) {
            stars.push({ x: Math.random() * canvas.width, y: Math.random() * 250, size: Math.random() * 2 + 1 });
        }

        // الأسماك
